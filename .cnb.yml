$:
    vscode:
        - docker:
            image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Claude.yml
          runner:
            cpus: 32
          services:
            - vscode
            - docker
          stages:
              - name: 授予install_gpg_keys.sh权限
                script:
                    - chmod +x /workspace/install_gpg_keys.sh
              - name: 安装claude CLI
                script:
                    - npm install -g @anthropic-ai/claude-code
                    - echo "claude CLI安装完成"
              - name: 安装qwen CLI
                script:
                    - npm install -g @qwen-code/qwen-code@latest
                    - echo "qwen CLI安装完成"
              - name: 安装CodeBuddy CLI
                script:
                    - npm install -g @tencent-ai/codebuddy-code
                    - echo "CodeBuddy CLI安装完成"
              - name: 安装Qoder CLI
                script:
                  - curl -fsSL https://qoder.com/install | bash
                  - echo "Qoder CLI安装完成"
              - name: 安装sudo更新APT源
                script:
                    - sudo apt-get update
                    - sudo apt-get install -y lsof net-tools jq
                    - echo "依赖完成"
              - name: 安装Git LFS
                script:
                    - sudo apt-get install -y git-lfs
                    - git lfs install
                    - echo "Git LFS安装完成"
              - name: 创建codebuddy配置文件夹
                script:
                    - mkdir -p /root/.codebuddy
                    - curl -o /root/.codebuddy/models.json https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/codebuddy.json
                    - echo "已创建 root/.codebuddy 文件夹并下载 models.json"
              - name: 克隆Astrbot并重新克隆
                script:
                  - git clone https://github.com/AstrBotDevs/AstrBot.git /tmp/astrbot-tmp
                  - cp -r /tmp/astrbot-tmp/astrbot /workspace
                  - rm -rf /tmp/astrbot-tmp
                  - git clone https://github.com/AstrBotDevs/AstrBot.git

main:
      # 注意：本仓库已移除 CNB 侧的覆盖率上报（原「覆盖率测试 + testing:coverage」作业）。
      # 单元测试覆盖率现统一由 GitHub 侧 .github/workflows/coverage.yml 产出并上报 Codecov，
      # 徽章见 README 顶部。CNB 侧仅保留「同步到 GitHub」作业。
      #
      # 同步策略（强制单向覆盖）：
      #   1. 主同步走 git-sync（sync_mode: force，以 CNB 仓库为唯一事实来源强制覆盖 GitHub main）；
      #   2. 兜底同步走原生 git push --force：git-sync 若因配置漂移失败，仍能保证 GitHub 与其对齐；
      #   3. 兜底阶段失败不拦截流水线（allow_failure），避免同步问题反向拖垮主分支构建。
      push:
        - services:
            - docker
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Github.yml
          stages:
            - name: 同步到GitHub
              image: tencentcom/git-sync
              settings:
                target_url: https://github.com/xiaomizhoubaobei/astrbot_plugin_models_ai.git
                auth_type: https
                username: ${GIT_USERNAME}
                password: ${GIT_ACCESS_TOKEN}
                branch: main
                # force：以 CNB 仓库为准强制覆盖 GitHub main，杜绝非快进（non-fast-forward）导致同步中断
                sync_mode: force
                git_user: ${GIT_USERNAME}
                git_email: ${GIT_EMAIL}
            - name: 兜底强制推送到GitHub
              allow_failure: true
              script: |
                set -euo pipefail
                # Git 令牌由 imports 注入，缺失则跳过兜底（主同步仍会执行）
                GH_USER="${GIT_USERNAME:-}"
                GH_TOKEN_VAL="${GIT_ACCESS_TOKEN:-}"
                GH_EMAIL="${GIT_EMAIL:-}"
                if [ -z "$GH_USER" ] || [ -z "$GH_TOKEN_VAL" ]; then
                  echo "未注入 GIT_USERNAME / GIT_ACCESS_TOKEN，跳过兜底强制推送"
                  exit 0
                fi
                # 同步源固定为 main（本作业仅在 main: push 事件下触发）
                SRC_BRANCH="main"
                git config user.name "$GH_USER"
                git config user.email "${GH_EMAIL:-$GH_USER@users.noreply.github.com}"
                # 用 https 令牌地址强制推送，确保 CNB 与 GitHub main 完全一致
                git push --force \
                  "https://${GH_USER}:${GH_TOKEN_VAL}@github.com/xiaomizhoubaobei/astrbot_plugin_models_ai.git" \
                  "HEAD:refs/heads/${SRC_BRANCH}"
