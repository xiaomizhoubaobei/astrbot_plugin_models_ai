name: astrbot_plugin_models_ai
desc: 可以使用来自多家模型服务提供商的模型生成图片或通过自然语言让 LLM 生成，让bot自拍给你看。
short_desc: 接入 Gitee AI / 千问云，支持文生图、风格转换、图片编辑与 LLM 生图工具。
version: v0.0.7
author: 祁筱欣
repo: https://github.com/xiaomizhoubaobei/astrbot_plugin_models_ai
# AstrBot 版本范围（PEP 440，不带 v 前缀）。上游会对该字段做校验，
# 声明本插件适配 AstrBot 4.x，避免在不兼容的大版本上被加载。
astrbot_version: ">=4.16,<5"
