# Codecov 配置：覆盖率报告口径与门禁策略
# 说明：本项目覆盖率由 .github/workflows/coverage.yml 产出 coverage.xml 后上报，
#       CNB 侧的测试与覆盖率上报（testing:coverage）已移除，Codecov 为唯一覆盖率来源。

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # 项目整体覆盖率：允许小幅波动，避免无关改动的 PR 被卡
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    # 本次变更的增量覆盖率：新增代码应当带测试
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true

# 覆盖率构成（供 Codecov 页面展开查看）
# 路径口径：coverage.yml 用 `--source=astrbot_plugin_models_ai` 传**包名**计数，
# 其 SF 会写成 `astrbot_plugin_models_ai/<相对路径>` 形态。Codecov 的 paths 是
# 后缀/通配匹配，下面的前缀写法即可命中；若把 CI 改回绝对路径 --source，
# SF 会退化成 /home/runner/work/... 这类路径，固定映射后匹配不到文件、覆盖率恒为 0。
flags:
  unittests:
    paths:
      - commands/
      - core/
      - gitee/
      - qianwen/
      - llm_tools/
      - main.py
    carryforward: true

# 忽略非业务代码，避免拉低口径
ignore:
  - "tests/"
  - "docs/"
  - "install_gpg_keys.sh"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
