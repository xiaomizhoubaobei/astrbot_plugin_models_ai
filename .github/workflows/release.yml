+      # 10.1 发布后校验：证据包三件套必须真的挂在 Release 上
+      #
+      # 「正文里写了证据包」与「证据包真的在」是两件事。action-gh-release 的
+      # files 一旦有路径取空（例如 Action 某个 output 没给出），它会安静地少传
+      # 一个资产，而流水线照样是绿的 —— 使用者点进 Release 只看到 zip，
+      # 于是就有了「tag 指向存在、产物却缺证据包」这种看起来自相矛盾的现象。
+      # 故发布后回查一次资产清单，缺件即红，让问题停在 CI 里而不是停在释出页上。
+      - name: 校验 Release 资产完整性
+        if: steps.get_info.outputs.publish == 'true'
+        env:
+          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
+          TAG_NAME: ${{ steps.get_info.outputs.tag_name }}
+          PLUGIN_NAME: ${{ steps.get_info.outputs.plugin_name }}
+          BUNDLE_NAME: ${{ steps.evidence_paths.outputs.bundle_name }}
+          SIGNATURE_NAME: ${{ steps.evidence_paths.outputs.signature_name }}
+          ANCHOR_NAME: ${{ steps.evidence_paths.outputs.anchor_name }}
+        run: |
+          set -euo pipefail
+          # 只读公开 REST 接口，不依赖 gh CLI（runner 上有，但别把校验绑在它身上）。
+          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}"
+          assets=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
+                         -H "Accept: application/vnd.github+json" \
+                         "${api}" | python3 -c 'import json,sys; print("\n".join(a["name"] for a in json.load(sys.stdin).get("assets", [])))')
+
+          echo "== Release ${TAG_NAME} 实际资产 =="
+          echo "${assets:-<空>}"
+
+          missing=0
+          for required in "${PLUGIN_NAME}.zip" "${BUNDLE_NAME}" "${SIGNATURE_NAME}" "${ANCHOR_NAME}"; do
+            if echo "$assets" | grep -qxF "$required"; then
+              echo "✓ ${required}"
+            else
+              echo "::error::Release ${TAG_NAME} 缺少必需资产: ${required}"
+              missing=1
+            fi
+          done
+          if [ "$missing" -ne 0 ]; then
+            echo "::error::证据包未完整挂到 Release 上：请核对 ci-evidence-pack 步骤是否成功、out-dir 是否与上传路径一致"
+            exit 1
+          fi
+          echo "Release 资产完整性校验通过"
+
