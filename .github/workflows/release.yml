+      # 9.0 把证据包相关路径固化到 job 级 output
+      #
+      # 后面有三处要用「证据包 / 签名 bundle / 锚点台账 到底叫什么」，分别是
+      # 发布正文、assets 清单、发布后校验。三处各写一遍文件名，就必然有一处写错，
+      # 而写错的后果是「资产没上传，但流水线是绿的」。故统一从这里取。
+      #
+      # 取值只认 Action 自己的 outputs（改名时它会跟着变），不手拼文件名；
+      # 只有在 Action 没给出时，才按它的命名约定兜底，保证正文里的名字与实物一致。
+      - name: 固化证据包产物路径
+        id: evidence_paths
+        if: steps.get_info.outputs.publish == 'true'
+        env:
+          BUNDLE_PATH: ${{ steps.evidence.outputs.bundle-path }}
+          BUNDLE_NAME: ${{ steps.evidence.outputs.bundle-name }}
+          SIG_BUNDLE: ${{ steps.evidence.outputs.signature-bundle }}
+          ANCHOR_FILE: ${{ steps.evidence.outputs.anchor-file }}
+          OUT_DIR: _evidence_dist
+        run: |
+          set -euo pipefail
+          bundle_name="${BUNDLE_NAME:-}"
+          if [ -z "$bundle_name" ]; then
+            bundle_name="evidence-v${{ steps.get_info.outputs.version }}.tar.gz"
+          fi
+          # cosign v3 只有 .sigstore.json 单文件形态；.sig + .crt 双文件已废弃。
+          # 这里按「包名 + 后缀」兜底，是为了让正文能如实写出签名文件名。
+          sig_bundle="${SIG_BUNDLE:-}"
+          if [ -z "$sig_bundle" ]; then
+            sig_bundle="${OUT_DIR}/${bundle_name}.sigstore.json"
+          fi
+          anchor_file="${ANCHOR_FILE:-_anchor/anchor.txt}"
+          echo "bundle_name=$bundle_name" >> "$GITHUB_OUTPUT"
+          echo "bundle_dir=${OUT_DIR}" >> "$GITHUB_OUTPUT"
+          echo "signature_name=$(basename "$sig_bundle")" >> "$GITHUB_OUTPUT"
+          echo "anchor_name=$(basename "$anchor_file")" >> "$GITHUB_OUTPUT"
+          echo "证据包: ${BUNDLE_PATH:-<未取到>}"
+          echo "签名 bundle: ${sig_bundle}"
+          echo "锚点台账: ${anchor_file}"
+
