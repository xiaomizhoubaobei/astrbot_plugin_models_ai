name: "代码质量分析"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  analyze:
    name: 分析（${{ matrix.language }} @ ${{ matrix.os }} / Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write

    strategy:
      fail-fast: false
      # 多矩阵：语言 × 操作系统。
      # CodeQL 的查询结果与语言强相关，与本机 Python 版本弱相关，
      # 故 Python 版本仅在 Linux（主运行器）上做多版本覆盖，避免矩阵规模翻倍。
      matrix:
        language: [ 'python' ]
        os: [ 'ubuntu-latest', 'windows-latest', 'macos-latest' ]
        python-version: [ '3.12', '3.13', '3.14' ]
        exclude:
          # 非 Linux 运行器只需最小编译/解析环境，不重复跑多版本
          - os: 'windows-latest'
            python-version: '3.12'
          - os: 'windows-latest'
            python-version: '3.13'
          - os: 'macos-latest'
            python-version: '3.12'
          - os: 'macos-latest'
            python-version: '3.13'

    steps:
    - name: 加固运行器（阻断模式下仅放行必要出站）
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          api.github.com:443
          github.com:443
          objects.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          uploads.github.com:443
          *.blob.core.windows.net:443
          *.githubapp.com:443
          *.actions.githubusercontent.com:443

    - name: 检出仓库
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: 初始化 CodeQL
      uses: github/codeql-action/init@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4.31.9
      with:
        languages: ${{ matrix.language }}

    - name: 自动构建
      uses: github/codeql-action/autobuild@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4.31.9

    - name: 执行 CodeQL 分析
      uses: github/codeql-action/analyze@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4.31.9
      with:
        # 同一语言的不同矩阵组合需用独立 category，避免结果互相覆盖
        category: "/language:${{ matrix.language }}/os:${{ matrix.os }}/py:${{ matrix.python-version }}"
