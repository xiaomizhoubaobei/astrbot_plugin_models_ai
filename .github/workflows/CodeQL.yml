name: "代码质量分析"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  # 最小权限：无 OIDC 联邦/云身份需求，**不授予** id-token: write——
  # 否则一旦某个 action 被替换，攻击者可凭空铸造云身份令牌（多余武器）。
  contents: read
  actions: read

jobs:
  analyze:
    name: 分析（${{ matrix.language }} @ ${{ matrix.os }} / Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      # 仅上传 CodeQL 结果需要 security-events: write；同样不需要 id-token。
      security-events: write

    strategy:
      fail-fast: false
      # CodeQL 的 Python 查询结果与**操作系统 / Python 版本基本无关**（它做的是
      # 源码级数据流分析，不做跨版本运行时覆盖）。此前用 os × python-version 的
      # 组合矩阵（5 个组合）只会把同一份分析重复跑 5 次、各自上传一个 category，
      # 徒增 CI 成本而**不增加分析覆盖**。故收敛为**单一运行器 + 单一版本**；
      # 若确需验证多环境运行时行为，请另建独立的测试矩阵，而非塞进 CodeQL。
      matrix:
        language: [ 'python' ]
        os: [ 'ubuntu-latest' ]
        # 单版本工作流，与测试矩阵的起始版本对齐到 3.13
        python-version: [ '3.13' ]

    steps:
    - name: 加固运行器（审计所有出站调用）
      # 观察模式：egress-policy 保持 audit，仅记录出网调用、不阻断构建。
      # 曾短暂切换为 block + 白名单，因阻断模式下任何未覆盖端点都会直接
      # 让步骤失败（如 setup-python 回退拉取 versions-manifest.json），
      # 故按仓库统一策略回退为观察模式；后续如需收紧，先凭审计日志收敛白名单。
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: 检出仓库
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: 初始化 CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}

    - name: 自动构建
      uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

    - name: 执行 CodeQL 分析
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        # 单一组合下 category 只需按语言区分；保留语言维度便于未来扩展多语言。
        #
        # ⚠️ 【category 迁移说明】本次由 `/os:<os>/py:<ver>` 收敛为 `/language:<lang>`，
        #   Code Scanning 会据此把它视为**另一个分析类别**：历史告警仍挂在旧 category 下，
        #   既不会被本工作流刷新，也**不会**被自动关闭。
        #   处理方式：合并后到 Security → Code scanning 里把旧 category
        #   （形如 `/os:ubuntu-latest/py:3.13`）下的告警**手动 dismiss（wont fix / used in tests）**
        #   或删除该分析配置，否则 ai-audit 会一直把它们当成 open 告警反复送审。
        #   等旧 category 清空并累积一次成功运行后，新 category 才成为唯一事实来源。
        category: "/language:${{ matrix.language }}"
