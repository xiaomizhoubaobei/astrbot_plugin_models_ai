# 此工作流程会警告并随后关闭在指定时间内没有活动的议题和拉取请求。
#
# 您可以通过修改此文件来调整行为。
# 更多信息，请参阅：
# `https://github.com/actions/stale`
name: 标记不活跃的议题和拉取请求

on:
  schedule:
  - cron: '00 10 * * *'

permissions:
  contents: read
  actions: read

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      actions: read
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      # v11.0.0：底层迁移到 ESM 并升级依赖（含 brace-expansion 安全修复），
      # 输入参数与运行时（node24）均未变，故下方 inputs 无需调整。
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            ⚠️ 此议题已超过30天没有活动

            由于长时间没有新的活动或回复，此议题已被标记为不活跃状态。

            如果您仍希望处理此议题，请添加新的评论或回复，这将取消不活跃状态。
            如果此议题已解决或不再相关，请手动关闭它。

            感谢您的贡献！
          stale-pr-message: |
            ⚠️ 此拉取请求已超过30天没有活动

            由于长时间没有新的活动或更新，此拉取请求已被标记为不活跃状态。

            如果您仍希望合并此拉取请求，请添加新的评论或更新代码，这将取消不活跃状态。
            如果此拉取请求已不再需要，请手动关闭它。

            感谢您的贡献！
          # 显式声明阈值：actions/stale 默认 days-before-stale 为 60，
          # 与消息文案的「30天」不一致，此处按文案统一为 30 天。
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: '🔴 长时间无活动-议题'
          stale-pr-label: '🔴 长时间无活动-拉取请求'
