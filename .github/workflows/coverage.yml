name: Coverage

# 触发时机：main 分支的推送与 PR。
# 说明：本仓库代码会在 main 推送时由 CNB（.cnb.yml）同步至本 GitHub 镜像仓库，
#       因此 CNB 侧的每次变更最终都会以 push 形式落到这里，覆盖率随之更新；
#       pull_request 仅用于 PR 场景的覆盖率对比（Codecov 会给出 diff 覆盖）。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一分支/PR 的旧运行自动取消，避免重复上报造成徽章抖动
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  coverage:
    name: 单元测试与覆盖率 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 测试矩阵：只在「当前受支持的 3.12 / 3.13 / 3.14」上跑单测，
    # 逐个版本覆盖是为了尽早暴露版本相关的行为差异（如 asyncio 事件循环、
    # 标准库弃用告警），而不是只在一个版本上「绿了就算过」。
    # fail-fast: false —— 某一版本失败不该掩盖其它版本的结论。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    # ⚠️ 【令牌只在「上报」这一步可见】切勿把 CODECOV_TOKEN 提到 job / workflow 级 env：
    #   本 job 会 `pip install -r requirements.txt` 并执行 **PR 可控的测试代码**，
    #   job 级 env 会让这些不可信代码直接读到 Secret，一个 `curl $CODECOV_TOKEN`
    #   就能把它外泄。故 Secret 只注入到「上报覆盖率到 Codecov」那一步。
    #   `if` 里不能直接写 secrets（GitHub 不允许在 if 中引用 secrets），故另设一个
    #   **非机密**的存在性标志，仅用于条件判断，泄露它没有任何风险。
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      # 安全加固：与仓库内其余全部工作流一致，内联 step-security/harden-runner。
      # 本工作流会在 PR（不可信来源）场景运行仓库自带测试代码，属高风险面，
      # 故必须补齐该审计 Action；egress-policy: audit 仅审计出网调用，
      # 保持"记录不阻断"的既有策略，与其它工作流口径统一。
      - name: 加固运行器 (审计全部出网调用)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本 job 会执行 PR 可控的测试代码，凭据不得留在本地 git 配置里被读取外泄
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio coverage

      # 仓库目录名不等于插件包名（astrbot_plugin_models_ai），测试统一按
      # 「顶层包名」导入（见 tests/_coverage_support.py）。此处铺一层同名符号
      # 链接，把仓库根暴露为包，使导入与覆盖率统计都能定位到真实源码行号。
      - name: 构造可导入的包视图
        run: ln -sfn "$GITHUB_WORKSPACE" "$RUNNER_TEMP/astrbot_plugin_models_ai"

      - name: 运行测试并统计覆盖率
        env:
          # 覆盖率数据文件落到临时目录，避免污染工作区
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          # 包视图目录先进入 sys.path，让顶层包名可解析
          PYTHONPATH: ${{ runner.temp }}
        run: |
          # --source 用「包名」计数，coverage 会以包所在目录为基准写出相对路径
          # （如 astrbot_plugin_models_ai/commands/generate.py），从而正确定位
          # 到 GitHub 工作区文件；若误用绝对路径 --source，SF 会退化成
          # /home/runner/work/... 这类路径，Codecov 固定路径映射后匹配不到文件。
          python -m coverage run --source=astrbot_plugin_models_ai -m pytest tests -q
          python -m coverage report -m
          python -m coverage xml -o coverage.xml

          # 兜底自检：没收集到任何覆盖率数据就明确失败，而不是上传一份空报告。
          python -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage.xml').getroot()
          files = [c.get('filename') for c in root.iter('class')]
          assert files, 'coverage.xml 里没有任何文件，包名很可能没被解析到'
          print('覆盖率文件:', files)
          "

      # 上报 Codecov：仅在拿到 token（仓库 Secret 或同名 CNB 密钥）时执行。
      # 未配置 token 时跳过上报，仅留存 coverage.xml 工件，不使 CI 失败。
      - name: 上报覆盖率到 Codecov
        id: codecov
        # 仅当拿到 token 才上报；token 为空时跳过，避免空 token 触发失败
        if: ${{ always() && env.HAS_CODECOV_TOKEN == 'true' }}
        continue-on-error: true
        # 令牌的作用域收窄到这一步：上面 install/test 阶段的环境里读不到它。
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        # 钉定 v7.1.1（提交 303a32d…）：不随 tag 浮动，避免上游改 tag 时静默换代码。
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          # 覆盖率只跑单一版本（矩阵起始的 3.12）：多版本重复上报同一份
          # 源码的覆盖率没有增量信息，只会让 Codecov 侧互相覆盖。
          # 其余版本由下面的 tests 矩阵负责「跑通」这一结论。
          flags: unittests
          name: python-3.12
          fail_ci_if_error: false
          verbose: true
          # CLI 默认下载到检出根目录并长期留存；改用临时目录并在结束后清理，
          # 避免工作区里多出一个 codecov 二进制（也只是卫生问题，非必要）。
          cleanup: true
          # 钉定 CLI 版本，避免 default 的 latest 静默漂移导致上传协议行为变化。
          version: v11.3.1

      # 上传覆盖率报告工件，便于人工下载核对。
      - name: 上传覆盖率报告工件
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  # 纯单测矩阵：3.12 / 3.13 / 3.14 逐版本跑一遍 pytest。
  # 为什么与 coverage job 分开：覆盖率只需算一次（同一份源码），
  # 而「代码在这些版本上都能跑通」必须逐版本验证；两者混在一个 job 里
  # 会让覆盖率被重复计算、被重复上报，纯属浪费。
  tests:
    name: 单测 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 某一版本失败不应掩盖其它版本的结果，全部跑完再下结论
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: 加固运行器 (审计全部出网调用)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: 构造可导入的包视图
        run: ln -sfn "$GITHUB_WORKSPACE" "$RUNNER_TEMP/astrbot_plugin_models_ai"

      - name: 运行单元测试
        env:
          PYTHONPATH: ${{ runner.temp }}
        run: |
          # 不走 coverage 启动器：这里只关心「能不能跑通」，
          # 覆盖率统计与上报由上面的 coverage job 负责。
          python -m pytest tests -q

  # 汇总门禁：分支保护只认这一个检查项，避免每加一个版本都要改一次保护规则。
  # 任一矩阵任务失败 / 被取消，这里都会失败，故不会被单个版本的红灯漏过。
  tests-gate:
    name: 单测矩阵汇总
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    steps:
      - name: 校验矩阵结果
        run: |
          # needs.tests.result 在「至少一个失败」「被取消」时都不是 success，
          # 故这里用严格相等判定，任何非 success 都判失败。
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "❌ 单测矩阵未全部通过：${{ needs.tests.result }}"
            exit 1
          fi
          echo "✅ 3.12 / 3.13 / 3.14 全部通过"
