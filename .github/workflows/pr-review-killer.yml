name: '🚀 iFlow CLI PR 审查终结者'

on:
  issue_comment:
    types:
      - 'created'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'write'
  issues: 'write'
  pull-requests: 'write'

jobs:
  modify-code:
    if: |-
      github.event.sender.type != 'Bot' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        contains(github.event.comment.body, '@iflow-cli /review-killer') ||
        contains(github.event.comment.body, '@iFlow-CLI /review-killer') ||
        contains(github.event.comment.body, '@IFLOW-CLI /review-killer') ||
        contains(github.event.comment.body, '@IFlow-CLI /review-killer')
      ) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: 'ubuntu-latest'
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 检出 PR 分支
        uses: xt0rted/pull-request-comment-branch@v3.0.0
        id: checkout_pr

      - name: 从评论中提取说明
        id: extract
        env:
          # 通过环境变量传递评论体，避免评论内容被直接内联进脚本导致命令注入/截断
          COMMENT: ${{ github.event.comment.body }}
          # 赋值指令的解析以「首个 =」切分键值，perl 长内容一旦折行（默认 80 列）
          # 会在行尾插入换行，把多行指令切碎；显式置 0 关闭折行，保证 --pe 的输出
          # 只有一个逻辑行（内容里的真实换行仍原样保留）。
          COLUMNS: '0'
        run: |
          set -euo pipefail

          # 关键点：整个「判定 → 提取 → 写 $GITHUB_OUTPUT」必须按「内容本身」处理，
          # 绝不能把 "$COMMENT" 内联进脚本（含 ``、$(...) 的评论会被二次求值，
          # 多行体也会直接把 YAML 内嵌脚本截断）；旧版正是内联写法。
          # 提取逻辑用 perl 整段扫描（-0 以 NUL 读入全部内容），取「最后一条触发指令」
          # 之后的剩余文本：前缀 .* 先贪婪吃掉此前所有内容，指令只按「行首」锚定
          # （^ 配合 /m），避免把指令行 /review-killer 之后的"再提一次"误当成触发；
          # 尾部只裁空格/制表符，保留 LF 缩进与空行。
          #
          # 前置守卫：perl 的 s/// 在「未命中」时会把输入原样吐出（不是空串）。
          # 而 job 级 if 用的是 contains(评论体, ...)，命中范围比「行首指令」更宽——
          # 评论里只要出现被引号/反引号包裹的 "@iflow-cli /review-killer" 字样，
          # job 就会进入本步骤，但此时行首并无指令行。缺了这层守卫，整段评论会被
          # 原样当作指令喂给 iFlow CLI（误投喂）。故先按「行首锚定」判定一次是否
          # 真正存在指令行，未命中则 output 保持空值、不发起任何提取。
          if printf '%s' "$COMMENT" | grep -qE '^[[:space:]]*@[iI][fF][lL][oO][wW]-[cC][lL][iI][[:space:]]+/[rR][eE][vV][iI][eE][wW]-[kK][iI][lL][lL][eE][rR]'; then
            INSTRUCTIONS=$(printf '%s' "$COMMENT" | perl -0 -pe 's/.*^[ \t]*\@[iI][fF][lL][oO][wW]-[cC][lL][iI][ \t]+\/[rR][eE][vV][iI][eE][wW]-[kK][iI][lL][lL][eE][rR][ \t]*//sm; s/[ \t]+\z//;')
          else
            INSTRUCTIONS=""
          fi

          # 多行内容必须用 heredoc 分隔符形式写入 $GITHUB_OUTPUT（"key<<DELIM" ... DELIM）：
          # 沿用 "instructions=$INSTRUCTIONS" 时换行会让后续行缺少 "key=" 前缀而报格式错误；
          # 运行器解析 heredoc 时同样会逐行判定分隔符，因此「输出内混入分隔符行」是
          # 结构风险，这里用「模型可控度低」的哨兵分隔符并把分隔符判定收紧为整行比较：
          # 若上游确有 %0A 折叠，还原出的换行会使 "__IFLOW_INSTRUCTIONS_EOF__:" 这类
          # 行不等于纯分隔符，不会被提前截断。当前 runner 逐行捕获 print 输出，
          # 未观察到该折叠行为，此为纵深防御。
          if [[ -n "${INSTRUCTIONS//[[:space:]]/}" ]]; then
            {
              echo "instructions<<__IFLOW_INSTRUCTIONS_EOF__"
              printf '%s\n' "$INSTRUCTIONS"
              echo "__IFLOW_INSTRUCTIONS_EOF__"
            } >> "$GITHUB_OUTPUT"
          else
            # 未提取到任何有效指令时，保持单行空值形式，避免多出一次 heredoc 写入
            echo "instructions=" >> "$GITHUB_OUTPUT"
          fi

      - name: '运行 iFlow CLI 实现'
        uses: iflow-ai/iflow-cli-action@v2.0.0
        id: 'iflow_cli_implementation'
        with:
          api_key: ${{ secrets.IFLOW_API_KEY }}
          timeout: "1800"
          debug: "true"
          settings_json: |
            {
                "selectedAuthType": "iflow",
                "apiKey": "${{ secrets.IFLOW_API_KEY }}",
                "baseUrl": "https://apihub.agnes-ai.com/v1",
                "modelName": "agnes-2.5-flash",
                "searchApiKey": "${{ secrets.IFLOW_API_KEY }}",
                "mcpServers": {
                  "github": {
                  "command": "github-mcp-server",
                  "args": [
                    "stdio"
                  ],
                  "includeTools": [
                    "add_issue_comment"
                  ],
                    "env": {
                      "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
                    }
                  }
                }
            }
          prompt: |
            ## 角色

            你是一个 PR 审查助手。你的任务是根据
            审查评论修改代码。请按照以下步骤操作：

            1. 分析环境变量中提供的 PR 审查评论。
            2. 从评论中提取修改说明："${{ steps.extract.outputs.instructions }}"
            3. 通过创建或修改所需文件来实现请求的更改。
            4. 确保所有更改根据审查要求都是完整和正确的。
            5. 仅专注于实现当前的审查评论。

            ## 指南

            - 进行所有必要的代码更改以解决审查评论
            - 确保新代码遵循现有的项目约定
            - 如适用，添加或修改测试
            - 将所有 shell 变量引用为 "${VAR}"（带引号和花括号）

            ## 提交更改

            实现更改后：
            1. 暂存所有修改的文件
            2. 使用描述性消息提交更改
            3. 将更改推送到 ${{ steps.checkout_pr.outputs.head_ref }} 分支

            **切勿直接提交到 `main` 分支。**
            **切勿强制推送**
