name: '🚀 iFlow CLI PR 审查终结者'

on:
  issue_comment:
    types:
      - 'created'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'write'
  issues: 'write'
  pull-requests: 'write'

jobs:
  modify-code:
    if: |-
      github.event.sender.type != 'Bot' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        contains(github.event.comment.body, '@iflow-cli /review-killer') ||
        contains(github.event.comment.body, '@iFlow-CLI /review-killer') ||
        contains(github.event.comment.body, '@IFLOW-CLI /review-killer') ||
        contains(github.event.comment.body, '@IFlow-CLI /review-killer')
      ) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: 'ubuntu-latest'
    steps:
      - name: 检出仓库
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 检出 PR 分支
        uses: xt0rted/pull-request-comment-branch@v3.0.0
        id: checkout_pr

      - name: 从评论中提取说明
        id: extract
        env:
          # 通过环境变量传递评论体，避免评论内容被直接内联进脚本导致命令注入/截断
          COMMENT: ${{ github.event.comment.body }}
        run: |
          # Extract everything after "@iflow-cli /review-killer " (case insensitive)
          # First check if the pattern exists, then extract
          if printf '%s' "$COMMENT" | grep -qiE '@iflow-cli[[:space:]]+/review-killer'; then
            # 用 perl 整体扫描（-0777 slurp + /s 修饰符）而非逐行的 sed：
            # sed 默认逐行处理、"." 不跨行，多行评论时只会匹配到指令所在行，
            # 后续指令行会被整段丢弃。perl 的 .* 配合 /s 可跨行贪婪匹配，
            # 去掉「最后一条触发指令」之前的所有内容，保留其后剩余文本（含换行）。
            INSTRUCTIONS=$(printf '%s' "$COMMENT" | perl -0777 -pe 's/.*\@[iI][fF][lL][oO][wW]-[cC][lL][iI]\s+\/[rR][eE][vV][iI][eE][wW]-[kK][iI][lL][lL][eE][rR]\s*//s' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          else
            INSTRUCTIONS=""
          fi
          # 多行内容必须用 heredoc 分隔符形式写入 $GITHUB_OUTPUT：
          # 若沿用 "echo instructions=$INSTRUCTIONS"，换行会让输出变成多行，
          # 超出首行的部分缺少 "key=" 前缀，GitHub Actions 会报格式错误并截断取值。
          {
            echo "instructions<<__IFLOW_INSTRUCTIONS_EOF__"
            printf '%s\n' "$INSTRUCTIONS"
            echo "__IFLOW_INSTRUCTIONS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: '运行 iFlow CLI 实现'
        uses: iflow-ai/iflow-cli-action@v2.0.0
        id: 'iflow_cli_implementation'
        with:
          api_key: ${{ secrets.IFLOW_API_KEY }}
          timeout: "1800"
          debug: "true"
          settings_json: |
            {
                "selectedAuthType": "iflow",
                "apiKey": "${{ secrets.IFLOW_API_KEY }}",
                "baseUrl": "https://apihub.agnes-ai.com/v1",
                "modelName": "agnes-2.5-flash",
                "searchApiKey": "${{ secrets.IFLOW_API_KEY }}",
                "mcpServers": {
                  "github": {
                  "command": "github-mcp-server",
                  "args": [
                    "stdio"
                  ],
                  "includeTools": [
                    "add_issue_comment"
                  ],
                    "env": {
                      "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
                    }
                  }
                }
            }
          prompt: |
            ## 角色

            你是一个 PR 审查助手。你的任务是根据
            审查评论修改代码。请按照以下步骤操作：

            1. 分析环境变量中提供的 PR 审查评论。
            2. 从评论中提取修改说明："${{ steps.extract.outputs.instructions }}"
            3. 通过创建或修改所需文件来实现请求的更改。
            4. 确保所有更改根据审查要求都是完整和正确的。
            5. 仅专注于实现当前的审查评论。

            ## 指南

            - 进行所有必要的代码更改以解决审查评论
            - 确保新代码遵循现有的项目约定
            - 如适用，添加或修改测试
            - 将所有 shell 变量引用为 "${VAR}"（带引号和花括号）

            ## 提交更改

            实现更改后：
            1. 暂存所有修改的文件
            2. 使用描述性消息提交更改
            3. 将更改推送到 ${{ steps.checkout_pr.outputs.head_ref }} 分支

            **切勿直接提交到 `main` 分支。**
            **切勿强制推送**
