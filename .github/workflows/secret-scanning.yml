name: 密钥扫描

# 最小权限：仅需读取仓库内容与 Actions 元数据（trufflehog 只读检出并扫描）。
permissions:
  contents: read
  actions: read

# 不设 paths 过滤：密钥可能出现在 YAML/配置/文档等任意文件中，
# 只扫 Python 文件会漏掉这些高价值目标。改为对所有变更全量扫描。
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 加固运行器（审计所有出站调用）
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 密钥扫描
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown
